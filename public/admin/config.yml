# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

# This file is public by design. Sveltia prompts for GitHub authentication in
# the browser; never put a token or app password in this file.
backend:
  name: github
  repo: Shikibashi/edriffles-blog
  branch: master

# Sveltia requires a global media folder. The blog collection overrides this
# with entry-relative folders below, so post images still live beside index.md.
media_folder: /public/media
public_folder: /media

collections:
  - name: blog
    label: Blog posts
    label_singular: Blog post
    folder: /src/content/blog
    path: '{{slug}}/index'
    slug: '{{uuid_short}}'
    media_folder: ''
    public_folder: ''
    preview_path: /blog/{{slug}}/
    thumbnail: heroImage
    fields:
      - { label: Title, name: title, widget: string, required: false }
      - { label: Description, name: description, widget: text, required: false }
      - { label: Publication date, name: pubDate, widget: datetime, type: date }
      - { label: Updated date, name: updatedDate, widget: datetime, type: date, required: false }
      - { label: Homepage / hero image, name: heroImage, widget: image, required: false }
      - { label: Image alt text, name: heroImageAlt, widget: string, required: false }
      - { label: Body, name: body, widget: markdown, required: false }
